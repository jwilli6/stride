<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>STRIDE - Kinetic Pulse Tracker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-surface": "#fdfbfe",
              "surface-variant": "#242629",
              "on-secondary": "#5a5300",
              "surface-dim": "#0d0e10",
              "surface-bright": "#2b2c2f",
              "error-dim": "#d53d18",
              "on-secondary-fixed-variant": "#645d00",
              "on-primary-fixed-variant": "#596700",
              "secondary-fixed": "#f4e650",
              "outline": "#757578",
              "inverse-primary": "#586500",
              "secondary-fixed-dim": "#e5d843",
              "background": "#0d0e10",
              "secondary-container": "#676000",
              "on-tertiary-fixed-variant": "#675400",
              "on-primary-fixed": "#3f4900",
              "surface-container-high": "#1e2022",
              "on-primary-container": "#505d00",
              "on-error-container": "#ffd2c8",
              "on-tertiary": "#665300",
              "on-background": "#fdfbfe",
              "inverse-surface": "#faf9fb",
              "on-primary": "#586500",
              "on-secondary-container": "#fff8d5",
              "surface-container": "#181a1c",
              "tertiary-fixed-dim": "#eec930",
              "on-error": "#450900",
              "surface-container-low": "#121316",
              "surface": "#0d0e10",
              "surface-container-lowest": "#000000",
              "primary-fixed": "#daf900",
              "primary-container": "#daf900",
              "on-secondary-fixed": "#464000",
              "tertiary-fixed": "#fdd73e",
              "on-surface-variant": "#ababad",
              "primary-fixed-dim": "#cdea00",
              "on-tertiary-fixed": "#463900",
              "outline-variant": "#47484a",
              "inverse-on-surface": "#555557",
              "tertiary-dim": "#eec930",
              "surface-tint": "#f6ffc0",
              "secondary": "#f4e650",
              "primary": "#f6ffc0",
              "primary-dim": "#d0ed00",
              "tertiary-container": "#fdd73e",
              "tertiary": "#ffe798",
              "secondary-dim": "#e5d843",
              "error": "#ff7351",
              "error-container": "#b92902",
              "surface-container-highest": "#242629",
              "on-tertiary-container": "#5c4b00"
            },
            fontFamily: {
              "headline": ["Lexend"],
              "body": ["Lexend"],
              "label": ["Lexend"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-gradient {
            background: linear-gradient(135deg, #f6ffc0 0%, #daf900 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="bg-[#0d0e10] dark:bg-[#0d0e10] flex justify-between items-center px-6 py-4 w-full docked full-width top-0 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#f6ffc0] text-2xl">directions_walk</span>
<h1 class="font-['Lexend'] font-extrabold tracking-tight text-2xl italic text-[#f6ffc0]">STRIDE</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden active:scale-95 duration-200 cursor-pointer">
<img alt="User Profile Avatar" class="w-full h-full object-cover" data-alt="Close up portrait of a male runner" src="../assets/images/image_0a21f247.jpg"/>
</div>
</header>
<main class="min-h-screen pt-20 pb-32 px-6 flex flex-col gap-8">
<!-- Kinetic Metric Display -->
<section class="mt-8">
<div class="flex flex-col">
<span class="text-on-surface-variant font-label text-sm uppercase tracking-[0.2em] mb-2">Distance</span>
<div class="flex items-baseline gap-2">
<h2 class="text-8xl font-black italic tracking-tighter text-primary">4.28</h2>
<span class="text-2xl font-bold text-on-surface-variant italic">MI</span>
</div>
</div>
<div class="mt-12 grid grid-cols-2 gap-4">
<div class="bg-surface-container-low p-6 rounded-xl flex flex-col">
<span class="text-on-surface-variant font-label text-xs uppercase tracking-widest mb-1">Steps</span>
<span class="text-4xl font-extrabold text-on-surface tracking-tight">8,432</span>
</div>
<div class="bg-surface-container-low p-6 rounded-xl flex flex-col">
<span class="text-on-surface-variant font-label text-xs uppercase tracking-widest mb-1">Calories</span>
<span class="text-4xl font-extrabold text-secondary tracking-tight">312</span>
</div>
</div>
</section>
<!-- Map Overview (Asymmetric Bento) -->
<section class="relative w-full aspect-video rounded-xl overflow-hidden bg-surface-container-high group">
<img alt="Route Map" class="w-full h-full object-cover opacity-60 grayscale hover:grayscale-0 transition-all duration-700" data-alt="Abstract aerial view of city park trails" data-location="Central Park, New York" src="../assets/images/image_19c407fa.jpg"/>
<!-- Map Overlay UI -->
<div class="absolute top-4 left-4 flex gap-2">
<div class="bg-surface-container-lowest/70 backdrop-blur-md px-3 py-1.5 rounded-lg border border-outline-variant/20 flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<span class="text-[10px] font-bold uppercase tracking-tighter">Live GPS</span>
</div>
</div>
<div class="absolute bottom-4 right-4">
<button class="w-12 h-12 rounded-lg bg-surface-container-lowest/80 backdrop-blur-md flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">fullscreen</span>
</button>
</div>
</section>
<!-- Performance HUD & Controls -->
<section class="flex flex-col gap-6">
<div class="flex items-center justify-between">
<div class="flex flex-col">
<h3 class="text-xl font-bold italic tracking-tight uppercase">Session Mode</h3>
<p class="text-on-surface-variant text-xs">Dynamic interval tracking enabled</p>
</div>
<!-- Interval Toggle -->
<button class="bg-surface-container-high p-1 rounded-full w-14 h-8 relative flex items-center">
<div class="absolute right-1 w-6 h-6 rounded-full kinetic-gradient shadow-[0_0_12px_rgba(246,255,192,0.4)]"></div>
</button>
</div>
<!-- Main Start/Stop Action -->
<div class="flex gap-4 items-center">
<button class="flex-1 kinetic-gradient h-20 rounded-xl flex items-center justify-center gap-3 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">pause</span>
<span class="text-on-primary font-black text-xl italic uppercase tracking-wider">Pause Session</span>
</button>
<button class="w-20 h-20 bg-error-container rounded-xl flex items-center justify-center group active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-on-error-container text-3xl group-hover:rotate-90 transition-transform duration-300">stop</span>
</button>
</div>
</section>
<!-- Dynamic Splits -->
<section class="mb-8">
<div class="flex justify-between items-end mb-4">
<h3 class="font-bold text-lg italic tracking-tight">RECENT SPLITS</h3>
<span class="text-primary text-[10px] font-bold tracking-widest uppercase cursor-pointer hover:opacity-80">View All</span>
</div>
<div class="space-y-3">
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg">
<div class="flex items-center gap-4">
<span class="text-outline-variant font-black italic">01</span>
<span class="font-bold">12'42" /mi</span>
</div>
<span class="material-symbols-outlined text-primary text-sm">trending_up</span>
</div>
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg">
<div class="flex items-center gap-4">
<span class="text-outline-variant font-black italic">02</span>
<span class="font-bold">11'58" /mi</span>
</div>
<span class="material-symbols-outlined text-secondary text-sm">bolt</span>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-[#121316]/70 backdrop-blur-xl shadow-[0_-4px_24px_rgba(246,255,192,0.08)]">
<!-- Walk (Active) -->
<a class="flex flex-col items-center justify-center text-[#f6ffc0] bg-[#1e2022] rounded-lg px-3 py-1 active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">explore</span>
<span class="font-['Lexend'] font-medium text-[10px] uppercase tracking-widest">Walk</span>
</a>
<!-- History -->
<a class="flex flex-col items-center justify-center text-[#ababad] opacity-60 hover:text-[#f6ffc0] transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1">history</span>
<span class="font-['Lexend'] font-medium text-[10px] uppercase tracking-widest">History</span>
</a>
<!-- Music -->
<a class="flex flex-col items-center justify-center text-[#ababad] opacity-60 hover:text-[#f6ffc0] transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1">speed</span>
<span class="font-['Lexend'] font-medium text-[10px] uppercase tracking-widest">Music</span>
</a>
<!-- Settings -->
<a class="flex flex-col items-center justify-center text-[#ababad] opacity-60 hover:text-[#f6ffc0] transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1">settings</span>
<span class="font-['Lexend'] font-medium text-[10px] uppercase tracking-widest">Settings</span>
</a>
</nav>
</body></html>
